services:
  mysql:
    image: mysql:8.0
    container_name: caretriage-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: caretriage
      MYSQL_USER: linhtranne
      MYSQL_PASSWORD: "123456"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: caretriage-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./code/backend/backend
    container_name: caretriage-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_NAME: caretriage
      DB_USERNAME: linhtranne
      DB_PASSWORD: 123456
      JWT_SECRET: ${JWT_SECRET:-caretriage-docker-secret-key-min-256-bits-long-for-hmac-sha256}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-2.5-pro}
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME:-}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: "./code/front end/frontend"
    container_name: caretriage-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  admin-frontend:
    build: "./code/front end/admin-frontend"
    container_name: caretriage-admin
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
