spring:
  profiles:
    active: prod # Chuyển sang profile prod để dùng MySQL
  application:
    name: caretriage-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:caretriage}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never # Ngăn chặn chạy data.sql gây lỗi trùng lặp dữ liệu

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 10MB

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:caretriage-default-super-secret-key-at-least-256-bits-long-for-hs256-production}
    expiration-ms: 86400000  # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

  # AI Service
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-api-key: ${AI_SERVICE_INTERNAL_KEY:dummy-key-for-local-and-test}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:3000}
    read-timeout-seconds: ${AI_READ_TIMEOUT_SECONDS:30}
    write-timeout-seconds: ${AI_WRITE_TIMEOUT_SECONDS:10}
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${AI_RETRY_INITIAL_BACKOFF_MS:300}
      max-backoff-ms: ${AI_RETRY_MAX_BACKOFF_MS:2000}

  # Firebase Storage
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:config/firebase-service-account.json}
    bucket-name: ${FIREBASE_BUCKET_NAME:caretriage.appspot.com}

# Logging
logging:
  level:
    com.caretriage: DEBUG
    org.springframework.security: INFO
