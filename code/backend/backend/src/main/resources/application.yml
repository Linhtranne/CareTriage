spring:
  profiles:
    active: prod # Chuyển sang profile prod để dùng MySQL
  application:
    name: caretriage-backend
  config:
    import: optional:file:../../../.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:caretriage}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never # Ngăn chặn chạy data.sql gây lỗi trùng lặp dữ liệu

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 10MB

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:caretriage-default-super-secret-key-at-least-256-bits-long-for-hs256-production}
    expiration-ms: 86400000  # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  chat:
    inactivity-timeout: 45s
    whole-turn-timeout: 120s
    active-turn-stale-timeout: 150s

  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}



  # LangChain4j Config
  ai:
    runtime: java
    gemini:
      api-key: AIzaSyBxUl5OtMzjzUiPS0V9FmcVYbAKPuRsNC4
      model-name: ${GEMINI_MODEL_NAME:gemini-2.5-pro}
      embedding-model-name: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
      temperature: 0.1
      timeout-seconds: 60
      connect-timeout-ms: 10000
      read-timeout-ms: 30000
    rag:
      enabled: ${RAG_ENABLED:true}
      index-path: ${RAG_INDEX_PATH:medical_rag_index.json}
      corpus-path: ${RAG_CORPUS_PATH:corpus}
      max-results: ${RAG_MAX_RESULTS:5}
      min-relevance-score: ${RAG_MIN_RELEVANCE_SCORE:0.3}
      max-context-characters: ${RAG_MAX_CONTEXT_CHARACTERS:6000}
      allowed-source-types: ${RAG_ALLOWED_SOURCE_TYPES:guideline,internal_reviewed}
      require-phi-safe: ${RAG_REQUIRE_PHI_SAFE:true}
      require-integrity-hash: ${RAG_REQUIRE_INTEGRITY_HASH:true}
      max-evidence-age-days: ${RAG_MAX_EVIDENCE_AGE_DAYS:730}

  # Firebase Storage
  firebase:
    config-path: ${FIREBASE_CONFIG_PATH:config/firebase-service-account.json}
    bucket-name: ${FIREBASE_BUCKET_NAME:caretriage.appspot.com}

# Logging
logging:
  level:
    com.caretriage: DEBUG
    org.springframework.security: INFO
