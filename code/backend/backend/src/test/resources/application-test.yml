spring:
  datasource:
    url: jdbc:h2:mem:caretriage_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-that-is-at-least-256-bits-long-for-hs256-testing-only
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000

  firebase:
    config-path: ""
    bucket-name: "test-bucket"

  ai:
    runtime: python
    gemini:
      api-key: demo
