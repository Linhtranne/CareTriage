name: AI Service Quality Gate

on:
  push:
    paths:
      - "code/backend/ai-service/**"
      - ".github/workflows/ai-service-quality.yml"
  pull_request:
    paths:
      - "code/backend/ai-service/**"
      - ".github/workflows/ai-service-quality.yml"

defaults:
  run:
    working-directory: code/backend/ai-service

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    env:
      TESTING: "true"
      LLM_PROVIDER: "mock"
      ENABLE_LIVE_EVALS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install ruff mypy pytest pytest-asyncio

      - name: Import check
        run: python -c "import app.main; print('import ok')"

      - name: Ruff Lint check
        run: ruff check . --no-cache

      - name: Ruff Format check
        run: ruff format --check . --no-cache

      - name: MyPy Service Layers Typecheck
        run: |
          mypy app/domain --no-incremental
          mypy app/application --no-incremental
          mypy app/shared --no-incremental
          mypy app/api --no-incremental
          mypy app/infrastructure --no-incremental

      - name: Run PyTest Suite
        run: python -m pytest -q

      - name: Run Triage Mocked Evaluations
        run: python evaluations/run_triage_evals.py --mode mocked --threshold 0.8

      - name: Clean Architecture Boundary Scan
        run: |
          echo "Scanning app/domain and app/application for illegal dependency imports..."
          if command -v rg >/dev/null 2>&1; then
            set +e
            violations=$(rg -n "from app\.infrastructure|import app\.infrastructure|from app\.api|import app\.api" app/application app/domain)
            exit_code=$?
            set -e
            if [ $exit_code -eq 0 ]; then
              echo "$violations"
              echo "Error: Clean Architecture boundary violation detected."
              exit 1
            elif [ $exit_code -eq 1 ]; then
              echo "No Clean Architecture boundary violations found."
            else
              echo "ripgrep search failed with error code $exit_code."
              exit $exit_code
            fi
          else
            set +e
            violations=$(grep -rnE "from app\.infrastructure|import app\.infrastructure|from app\.api|import app\.api" app/application app/domain)
            exit_code=$?
            set -e
            if [ $exit_code -eq 0 ]; then
              echo "$violations"
              echo "Error: Clean Architecture boundary violation detected."
              exit 1
            elif [ $exit_code -eq 1 ]; then
              echo "No Clean Architecture boundary violations found."
            else
              echo "Grep search failed with error code $exit_code."
              exit $exit_code
            fi
          fi
