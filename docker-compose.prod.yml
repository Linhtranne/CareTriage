services:
  mysql:
    image: mysql:8.0
    container_name: caretriage-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - caretriage-net

  redis:
    image: redis:7-alpine
    container_name: caretriage-redis-prod
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_prod_data:/data
    command: redis-server --appendonly yes
    networks:
      - caretriage-net

  backend:
    image: ${DOCKER_USERNAME}/caretriage-backend:latest
    container_name: caretriage-backend-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-2.5-pro}
      GMAIL_SMTP_USERNAME: ${GMAIL_SMTP_USERNAME}
      GMAIL_SMTP_APP_PASSWORD: ${GMAIL_SMTP_APP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - caretriage-net

  frontend:
    image: ${DOCKER_USERNAME}/caretriage-frontend:latest
    container_name: caretriage-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - caretriage-net

  admin-frontend:
    image: ${DOCKER_USERNAME}/caretriage-admin:latest
    container_name: caretriage-admin-prod
    restart: unless-stopped
    ports:
      - "81:80"
    depends_on:
      - backend
    networks:
      - caretriage-net

volumes:
  mysql_prod_data:
  redis_prod_data:

networks:
  caretriage-net:
    driver: bridge
